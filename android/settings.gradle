include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// ML Kit Face Detection - manual link
include ':react-native-ml-kit_face-detection'
project(':react-native-ml-kit_face-detection').projectDir = new File(rootProject.projectDir, '../node_modules/@react-native-ml-kit/face-detection/android')