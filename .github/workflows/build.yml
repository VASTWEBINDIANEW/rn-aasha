name: Build APK

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (clients.json mein se)'
        required: true
        default: 'universalrecharge'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate client config
        run: node scripts/generate-config.js ${{ github.event.inputs.client }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.client }}
          path: android/app/build/outputs/apk/release/*.apk